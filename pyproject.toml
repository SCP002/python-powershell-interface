[project]
name = "python-powershell-interface"
version = "0.1.0"
description = "Run PowerShell commands and scripts on Windows in a Python-friendly way"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pwinput>=1.0.3",
    "pythonnet>=3.1.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff",
]

[tool.mypy]
follow_untyped_imports = true
mypy_path = "stubs"

[tool.pyright]
extraPaths = ["stubs"]
